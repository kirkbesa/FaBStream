<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Decklist Overlay</title>
  <link rel="stylesheet" href="/overlays/theme.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Single panel, pinned to the right of the screen. Only one player's list
       is ever up at a time — selecting the other one replaces it, same as
       deck reveal — so there's no left/right split to manage.

       Height follows the content: a fixed height leaves a slab of empty dark
       panel under a short list. Growth stops at MAX_PANEL_H, past which the
       content is zoom-scaled down to fit (see fitContent). */
    .panel {
      position: absolute;
      top: 60px;
      right: 60px;
      width: 400px;
      max-height: 960px;      /* keep in sync with MAX_PANEL_H below */
      background: var(--brand-panel);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.07);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateX(20px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .panel.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .panel-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
      border-top: 3px solid transparent;
      border-image: var(--brand-gradient) 1;
      border-radius: 12px 12px 0 0;
    }

    .header-player {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .header-deck {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
      font-style: italic;
    }

    .header-count {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-top: 2px;
    }

    /* No scrolling — content is zoom-scaled to fit.
       `flex: none` (not `flex: 1`) so this contributes its natural height to the
       panel: with flex-grow the panel would stretch to fill, which is exactly
       the fixed-height look we're getting rid of. */
    .scroll-area {
      overflow: hidden;
      flex: none;
      padding: 8px 0 12px;
      transform-origin: top left;
    }

    .type-group { margin-top: 4px; }

    .type-label {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 3px 20px 3px;
    }

    /* Text-only rows: quantity, pitch dot, name. No art — at sidebar
       width a 28px thumbnail reads as noise, and the list is scanned, not
       studied. Count leads because that's what a caster is looking for. */
    .card-row {
      display: flex;
      align-items: baseline;
      gap: 9px;
      padding: 2px 16px 2px 12px;
    }

    .card-count {
      font-size: 14px;
      font-weight: 700;
      color: rgba(255,255,255,0.45);
      min-width: 14px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    /* The maximum 3 copies — the cards that define the deck */
    .pitch-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0; align-self: center;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
    }
    .card-count.max { color: var(--brand-brass); }

    .card-name {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Unresolved rows */
    .card-name.bad { color: rgba(255,100,100,0.75); }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="panel-header" id="header">
      <div class="header-player" id="header-player">Player</div>
      <div class="header-deck"   id="header-deck"></div>
      <div class="header-count"  id="header-count"></div>
    </div>
    <div class="scroll-area" id="scroll-area"></div>
  </div>

  <script src="/overlays/ws.js"></script>
  <script src="/overlays/fab.js"></script>
  <script>
    // The panel's max-height in CSS. Measuring panel.offsetHeight instead would
    // be circular now that the height follows the content — it'd report the
    // content height we're trying to test against.
    const MAX_PANEL_H = 960

    function getActive(state) {
      return state.matches?.[state.activeMatchIndex ?? 0] ?? null
    }

    // Only scales down, and only when a list is too long to fit the cap. A
    // short list renders at 1:1 and the panel simply ends where the cards end.
    function fitContent() {
      const scrollArea = document.getElementById('scroll-area')
      const header     = document.getElementById('header')
      scrollArea.style.zoom = 1
      const availH   = MAX_PANEL_H - header.offsetHeight
      const naturalH = scrollArea.scrollHeight
      if (naturalH > availH) {
        scrollArea.style.zoom = availH / naturalH
      }
    }

    // Decklists arrive from state already resolved (name, pitch, cost, image),
    // so rendering is pure DOM work — no fetch, nothing to await, and nothing
    // that can fail if the venue network drops mid-match.
    function render(state) {
      const pi    = state.overlay?.decklistActive
      const panel = document.getElementById('panel')

      const player = Number.isFinite(pi) ? getActive(state)?.players?.[pi] : null
      if (!player) { panel.classList.remove('visible'); return }

      panel.classList.add('visible')
      renderPanel(player)
    }

    function renderPanel(player) {
      const scrollArea = document.getElementById('scroll-area')

      document.getElementById('header-player').textContent = player.name || 'TBD'
      document.getElementById('header-deck').textContent   = player.deckName || ''

      const deck = player.decklist
      scrollArea.innerHTML = ''

      if (!deck) {
        document.getElementById('header-count').textContent = 'No decklist loaded'
        return
      }

      const main = deck.main ?? []
      const side = deck.side ?? []
      const sideCount = side.reduce((n, c) => n + c.count, 0)

      document.getElementById('header-count').textContent =
        `${FAB.deckCount(deck)} cards · ${FAB.arenaCount(deck)} weapons & equipment` +
        (sideCount ? ` · ${sideCount} sideboard` : '')

      // Hero, weapons and equipment lead — the official list's first section.
      const arena = [
        deck.hero && { count: 1, ...deck.hero },
        ...FAB.sortRows(deck.arena ?? []),
      ].filter(Boolean)
      if (arena.length > 0) {
        scrollArea.appendChild(buildGroup('Hero / Weapon / Equipment', arena, FAB.typeColor('Hero'), { sort: false, dot: false }))
      }

      // Then the deck by pitch, red → yellow → blue, as the official list prints it.
      for (const [label, rows, color] of FAB.groupByPitch(main)) {
        scrollArea.appendChild(buildGroup(label, rows, color))
      }
      if (side.length > 0) {
        scrollArea.appendChild(buildGroup('Sideboard', side, null))
      }

      const unresolved = deck.unresolved ?? []
      if (unresolved.length > 0) {
        const groupEl = document.createElement('div')
        groupEl.className = 'type-group'
        const label = document.createElement('div')
        label.className = 'type-label'
        label.textContent = `Unresolved (${unresolved.length})`
        groupEl.appendChild(label)
        for (const u of unresolved) {
          const row = document.createElement('div')
          row.className = 'card-row'

          const count = document.createElement('div')
          count.className = 'card-count'
          count.textContent = u.count

          const name = document.createElement('div')
          name.className = 'card-name bad'
          name.textContent = u.rawName

          row.append(count, name)
          groupEl.appendChild(row)
        }
        scrollArea.appendChild(groupEl)
      }

      fitContent()
    }

    function buildGroup(label, rows, color, { sort = true, dot = true } = {}) {
      const groupEl = document.createElement('div')
      groupEl.className = 'type-group'

      const labelEl = document.createElement('div')
      labelEl.className = 'type-label'
      labelEl.textContent = `${label}  (${rows.reduce((n, c) => n + c.count, 0)})`
      if (color) labelEl.style.color = color
      groupEl.appendChild(labelEl)

      // Highest count first, then up the cost curve — how a player reads their
      // own list: the 3-ofs that define the deck at the top.
      for (const row of sort ? FAB.sortRows(rows) : rows) groupEl.appendChild(buildRow(row, dot))
      return groupEl
    }

    // Count, a pitch dot, then the name. The dot carries the pitch, so the name
    // reads clean ("Snatch", not "Snatch (red)").
    function buildRow(card, dot) {
      const row = document.createElement('div')
      row.className = 'card-row'

      const count = document.createElement('div')
      count.className = `card-count${card.count >= FAB.MAX_COPIES ? ' max' : ''}`
      count.textContent = card.count

      const name = document.createElement('div')
      name.className = 'card-name'
      name.textContent = card.name

      row.append(count)
      if (dot) {
        const pip = document.createElement('span')
        pip.className = 'pitch-dot'
        pip.style.background = FAB.cardAccent(card)
        row.append(pip)
      }
      row.append(name)
      return row
    }

    connectOverlay(msg => { if (msg.type === 'state') render(msg.data) })
  </script>
</body>
</html>
